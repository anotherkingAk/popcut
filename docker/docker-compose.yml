version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: popcut
      POSTGRES_PASSWORD: popcut
      POSTGRES_DB: popcut
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: popcut
      MINIO_ROOT_PASSWORD: popcut123
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
