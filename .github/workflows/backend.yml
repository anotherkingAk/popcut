name: Backend

on:
  workflow_call:
  workflow_dispatch:

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: popcut
          POSTGRES_PASSWORD: popcut
          POSTGRES_DB: popcut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @popcut/auth-service exec prisma generate
        working-directory: services/auth-service

      - name: Run Prisma validation
        run: pnpm --filter @popcut/auth-service exec prisma validate
        working-directory: services/auth-service

      - name: Prisma migrate check
        run: |
          pnpm --filter @popcut/auth-service exec prisma migrate deploy
          pnpm --filter @popcut/auth-service exec prisma validate
        working-directory: services/auth-service
        env:
          DATABASE_URL: postgresql://popcut:popcut@localhost:5432/popcut_test

      - name: Run tests
        run: pnpm --filter @popcut/auth-service test
        env:
          DATABASE_URL: postgresql://popcut:popcut@localhost:5432/popcut_test
          REDIS_URL: redis://localhost:6379

      - name: Lint
        run: pnpm --filter @popcut/auth-service lint
        continue-on-error: true

      - name: Build
        run: pnpm --filter @popcut/auth-service build
        working-directory: services/auth-service

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            services/auth-service/dist
            packages/*/dist
          retention-days: 7

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            services/auth-service/dist
            packages/*/dist
          key: ${{ runner.os }}-backend-${{ github.sha }}
