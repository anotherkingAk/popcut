name: Deploy to Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push auth-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.auth-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/auth-service:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ai-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ai-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/ai-service:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/popcut
            export TAG=staging-${{ github.sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    environment: staging

    steps:
      - name: Health check - API
        run: |
          curl --fail --retry 5 --retry-delay 10 --retry-max-time 60 \
            -o /dev/null -s -w "%{http_code}" \
            https://staging.popcut.app/api/health

      - name: Health check - Web
        run: |
          curl --fail --retry 5 --retry-delay 10 --retry-max-time 60 \
            -o /dev/null -s -w "%{http_code}" \
            https://staging.popcut.app

  notify:
    name: Post Deployment Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smoke-test]
    if: always()

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ needs.smoke-test.result }}';
            const state = outcome === 'success' ? 'success' : 'failure';
            const description = outcome === 'success'
              ? 'Staging deployment successful'
              : 'Staging deployment failed';
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: description,
              context: 'Deploy to Staging'
            });

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Staging deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Staging Deployment Failed*\nCommit: `${{ github.sha }}`\nTriggered by: ${{ github.actor }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
                  }
                }
              ]
            }
