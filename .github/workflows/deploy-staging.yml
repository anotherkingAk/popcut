# Deploy to Staging Environment
#
# REQUIRED GITHUB SECRETS:
#   AWS_ROLE_ARN       - IAM role for OIDC-based AWS auth (needs permissions for SSM, ECR/ECS, or EC2)
#   AWS_REGION         - AWS region (e.g. us-east-1)
#   HOST               - SSH host of the staging EC2 instance running Docker Compose
#   USERNAME           - SSH username (typically ec2-user)
#   SSH_KEY            - Private SSH key for the staging host
#   SLACK_WEBHOOK_URL  - Slack incoming webhook for deployment failure notifications
#
# ⚠ KNOWN GAPS:
#   1. No Terraform apply step - infrastructure changes require manual out-of-band apply.
#      Add a 'terraform' job before 'deploy' that runs:
#        cd infra/terraform/environments/staging && terraform apply -auto-approve
#   2. Domain mismatch: tfvars uses staging.popcut.ai but health checks use staging.popcut.app.
#      Align the domain in terraform.tfvars with the actual staging DNS.
#   3. certificate_arn is empty in staging/terraform.tfvars - set a valid ACM cert ARN
#      before HTTPS listener can serve traffic.
#   4. Deploy model mismatch: Terraform provisions Auto Scaling Groups but this workflow
#      deploys via SSH to a single host running Docker Compose. Consider replacing with
#      ASG instance refresh or migrating to ECS/Fargate.
#   5. No 'latest' Docker tag - only commit SHA tags. Add e.g. staging-latest for rollback.
#   6. Staging health checks don't use SMOKE_TEST_TOKEN (unlike production) - add if auth
#      is required on the staging health endpoint.
#
# TERRAFORM WORKSPACE: staging
#   State key: environments/staging/terraform.tfstate

name: Deploy to Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11
  REGISTRY: ghcr.io

jobs:
  # TODO: Add a 'terraform' job here that runs:
  #   - uses: hashicorp/setup-terraform@v3
  #   - aws-actions/configure-aws-credentials@v6 (for TF backend access)
  #   - cd infra/terraform/environments/staging
  #   - terraform init && terraform apply -auto-approve
  # This ensures infrastructure is up-to-date before deploying application code.
  # The terraform.tfvars file uses workspace "staging" and state key "environments/staging/terraform.tfstate".

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push auth-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.auth-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/auth-service:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/auth-service:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/web:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/web:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ai-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ai-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/ai-service:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/ai-service:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/popcut
            export TAG=staging-${{ github.sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    environment: staging

    steps:
      - name: Health check - API
        run: |
          curl --fail --retry 5 --retry-delay 10 --retry-max-time 60 \
            -o /dev/null -s -w "%{http_code}" \
            https://staging.popcut.app/api/health

      - name: Health check - Web
        run: |
          curl --fail --retry 5 --retry-delay 10 --retry-max-time 60 \
            -o /dev/null -s -w "%{http_code}" \
            https://staging.popcut.app

  notify:
    name: Post Deployment Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smoke-test]
    if: always()

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ needs.smoke-test.result }}';
            const state = outcome === 'success' ? 'success' : 'failure';
            const description = outcome === 'success'
              ? 'Staging deployment successful'
              : 'Staging deployment failed';
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: description,
              context: 'Deploy to Staging'
            });

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Staging deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Staging Deployment Failed*\nCommit: `${{ github.sha }}`\nTriggered by: ${{ github.actor }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
                  }
                }
              ]
            }
