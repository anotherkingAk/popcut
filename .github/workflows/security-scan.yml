name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: security-scan
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11

jobs:
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high || true
        continue-on-error: true

      - name: Generate npm audit report
        run: pnpm audit --json 2>/dev/null > npm-audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  trivy-scan:
    name: Docker Image & Config Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Scan Dockerfiles
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: docker/
          format: sarif
          output: trivy-config-results.sarif
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-results
          path: trivy-config-results.sarif
          retention-days: 30

      - name: Scan filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: 0
          severity: HIGH,CRITICAL
          skip-dirs: node_modules,.git

      - name: Upload filesystem results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-results
          path: trivy-fs-results.sarif
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense

  report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [npm-audit, codeql, trivy-scan, dependency-review]
    if: always()

    steps:
      - name: Build summary report
        run: |
          {
            echo "# Security Scan Report"
            echo ""
            echo "**Date:** $(date -u)"
            echo "**Trigger:** ${{ github.event_name }}"
            echo ""
            echo "## Results Summary"
            echo ""
            echo "| Scan | Status |"
            echo "|------|--------|"
            echo "| npm Audit | ${{ needs.npm-audit.result }} |"
            echo "| CodeQL Analysis | ${{ needs.codeql.result }} |"
            echo "| Trivy Docker & Config | ${{ needs.trivy-scan.result }} |"
            echo "| Dependency Review | ${{ needs.dependency-review.result }} |"
            echo ""
            echo "View detailed artifacts in the workflow run."
          } >> $GITHUB_STEP_SUMMARY
