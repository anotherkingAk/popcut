name: Web

on:
  workflow_call:
  workflow_dispatch:

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK & Engine
        run: |
          pnpm --filter @popcut/api-sdk build
          pnpm --filter @popcut/editor-engine build
        continue-on-error: true

      - name: Build main web app
        run: pnpm --filter @popcut/web build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4001
          NEXT_PUBLIC_AI_API_URL: http://localhost:8000

      - name: Build admin app
        run: pnpm --filter @popcut/admin build
        working-directory: apps/admin
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4001

      - name: Lint web
        run: pnpm --filter @popcut/web lint
        continue-on-error: true

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: apps/admin/out
          retention-days: 7
