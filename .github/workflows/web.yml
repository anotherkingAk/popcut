name: Web

on:
  workflow_call:
  workflow_dispatch:

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            services/*/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit
        continue-on-error: true

      - name: Build SDK & Engine
        run: |
          pnpm --filter @popcut/api-sdk build
          pnpm --filter @popcut/editor-engine build
        continue-on-error: true

      - name: Build main web app
        run: pnpm --filter @popcut/web build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4001
          NEXT_PUBLIC_AI_API_URL: http://localhost:8000

      - name: Build admin app
        run: pnpm --filter @popcut/admin build
        working-directory: apps/admin
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4001

      - name: Lint
        run: pnpm lint

      - name: Lint web
        run: pnpm --filter @popcut/web lint
        continue-on-error: true

      - name: Bundle size report
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          for dir in apps/web/out apps/admin/out; do
            if [ -d "$dir" ]; then
              size=$(du -sh "$dir" 2>/dev/null | cut -f1)
              name=$(basename "$(dirname "$dir")")
              echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: apps/admin/out
          retention-days: 7
